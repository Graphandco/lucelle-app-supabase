services:
   app:
      platform: linux/amd64
      container_name: lucelle-app
      image: dockerhub.graphandco.com/lucelle-app:latest
      build:
         context: .
         dockerfile: Dockerfile
         tags:
            - dockerhub.graphandco.com/lucelle-app:1.0.0
            - dockerhub.graphandco.com/lucelle-app:latest
         args:
            NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      pull_policy: always
      restart: unless-stopped
      env_file:
         - .env
      environment:
         HOSTNAME: 0.0.0.0
         PORT: 3001
      networks:
         - web-network

      # Sécurité de base (Hardening)
      cpus: 0.5
      mem_limit: 512m
      security_opt:
         - no-new-privileges:true
      tmpfs:
         - /tmp:rw,noexec,nosuid,size=128m
      volumes:
         - next_cache:/app/.next/cache

      # Logs maîtrisés
      logging:
         driver: "json-file"
         options:
            max-size: "10m"
            max-file: "3"

volumes:
   next_cache:

networks:
   web-network:
      external: true
